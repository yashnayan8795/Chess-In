spring:
  application:
    name: chess-api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:
        # ---- Game Service (Secured) ----
        - id: game-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/games/**
          filters:
            - JwtAuthenticationFilter

        # ---- AI Service (Secured) ----
        - id: ai-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - JwtAuthenticationFilter

        # ---- Multiplayer Service (Secured) ----
        - id: multiplayer-service
          uri: http://localhost:8083
          predicates:
            - Path=/ws/**
          filters:
            - JwtAuthenticationFilter

        # ---- Auth Service (Public - to be implemented) ----
        - id: auth-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/auth/**

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: "your-256-bit-secret-key-goes-here-and-it-must-be-very-long"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.chess: DEBUG
