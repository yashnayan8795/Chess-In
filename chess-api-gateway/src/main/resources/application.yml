spring:
  application:
    name: chess-api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # ---- Chess Game Service ----
        - id: game-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/games/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

        # ---- Chess AI Service ----
        - id: ai-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10

        # ---- Multiplayer Service ----
        - id: multiplayer-service
          uri: http://localhost:8083
          predicates:
            - Path=/ws/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
