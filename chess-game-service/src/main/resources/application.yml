spring:
  application:
    name: chess-game-service

  # ---- Active profile -------------------------------------------------
  # "dev"  → H2 in-memory, no MySQL/Redis needed (default for local dev)
  # "prod" → MySQL + Redis (set via env var: SPRING_PROFILES_ACTIVE=prod)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- Production datasource (overridden by dev profile for local use) --
  datasource:
    url: jdbc:mysql://localhost:3306/chess_games?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:chess_user}
    password: ${DB_PASS:chess_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.chess: DEBUG
    org.springframework.web: INFO
